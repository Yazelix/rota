[package]
name = "rota"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Picks which coding-agent subscription runs your next agent session"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yazelix/rota"
homepage = "https://github.com/Yazelix/rota"
readme = "README.md"
exclude = [".beads/"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
